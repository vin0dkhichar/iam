[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iam-partner-api"
version = "1.5.0"
description = "OpenG2P IAM partner API"
requires-python = ">=3.10"
dependencies = [
  "iam-core",
  "openg2p-fastapi-common",
  "asyncpg",
]

[tool.hatch.version]
path = "src/iam_partner_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_partner_api"]
